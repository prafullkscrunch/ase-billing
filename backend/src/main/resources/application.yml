spring:
  application:
    name: ase-billing

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ase_billing}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: ${DB_USER:ase}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      # Flyway owns the schema. Never let Hibernate create or update it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Added for the WC & QC module's invoice-upload endpoint (POST
  # /api/wcqc/upload). Billing has no multipart endpoints, so this key did
  # not exist before and nothing here affects any existing route.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  # Invoices below this status never appear in the SOA or any GST report.
  soa:
    include-status: FINALIZED

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  # Writes to a real file on disk, not just whatever console the app happens to
  # be running in — so there's something to open after the fact even if you
  # weren't watching the terminal when something went wrong. Rotates daily and
  # past 10MB, keeps 14 days, caps total size so it never grows unbounded.
  file:
    name: logs/ase-billing.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    root: info
    org.hibernate.SQL: ${SQL_LOG:info}
    # Every request/response, and every business decision (numbers issued,
    # deletions, rate changes, finalisations) that would otherwise be
    # invisible after the fact. Turn to DEBUG for step-by-step tracing when
    # chasing a specific bug; INFO is enough for normal operation.
    com.ase.billing: ${APP_LOG:info}
    # (com.ase.billing.wcqc needs no separate line — it's a sub-package of
    # com.ase.billing above, and Logback level configuration already
    # applies to descendant packages.)
